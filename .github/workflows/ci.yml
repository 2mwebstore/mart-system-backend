name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: com_mart_test
          MYSQL_USER: com_mart_test
          MYSQL_PASSWORD: test-only-password
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # The integration tests drop every table, so they refuse any database whose
      # name doesn't end in _test or whose host isn't local. REQUIRE_TEST_DB makes
      # them fail instead of skip when this database can't be reached.
      REQUIRE_TEST_DB: '1'
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: com_mart_test
      DB_USER: com_mart_test
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
